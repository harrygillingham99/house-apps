services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: house-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Password123}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: ./HouseAPI
      dockerfile: Dockerfile
    container_name: house-api
    depends_on:
      - sqlserver
    ports:
      - "81:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft: "Warning"
      Logging__LogLevel__Microsoft.Hosting.Lifetime: "Information"
      AllowedHosts: "*"
      ConnectionStrings__BCPCouncil: "https://online.bcpcouncil.gov.uk/bcp-apis/?api=BinDayLookup"
      ConnectionStrings__OpenWeather: "https://api.openweathermap.org/data/2.5/weather"
      ConnectionStrings__UniTimetable: "https://timetable.bournemouth.ac.uk/student/getevents"
      ConnectionStrings__NewsApi: "http://newsapi.org/v2/top-headlines?country=gb&apiKey="
      ConnectionStrings__ImagesFolder: "images"
      ConnectionStrings__CatTags: "https://cataas.com/api/tags"
      ConnectionStrings__GetCat: "https://cataas.com/cat/{0}"
      Lookup__Uprn: "${LOOKUP_UPRN:-100041084394}"
      TerrariaConfig__StartCommand: ""
      TerrariaConfig__ServerDirectory: ""
      NewsApi__Key: "${NEWS_API_KEY}"
      OpenWeatherApi__Key: "${OPENWEATHER_API_KEY}"
      SonarrApi__Key: "${SONARR_API_KEY:-nope}"
      RadarrApi__Key: "${RADARR_API_KEY:-nope}"
      DbConnections__HouseSql: "${HOUSE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=House;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;}"
    restart: unless-stopped
    volumes:
      - houseapi_images:/app/images
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  dashboard:
    build:
      context: ./HouseDashboard
      dockerfile: Dockerfile
    container_name: house-dashboard
    depends_on:
      - api
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft: "Warning"
      Logging__LogLevel__Microsoft.Hosting.Lifetime: "Information"
      AllowedHosts: "*"
      AppSettings__ApiUrl: "${DASHBOARD_API_URL:-http://api:8080}"
      AppSettings__SecurityCamUrl: "${DASHBOARD_SECURITY_CAM_URL:-http://192.168.1.123:8081/}"
      AppSettings__BlueMapUrl: "${DASHBOARD_BLUEMAP_URL:-http://192.168.1.69:8100/#world:-15:83:-57:0:2.36:1.52:0:0:free}"
      AppSettings__BinNoticePeriod: "${DASHBOARD_BIN_NOTICE_PERIOD:-1.5}"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  sqlserver_data:
  houseapi_images: